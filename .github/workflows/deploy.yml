name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject API URL Secret
        env:
          API_URL_SECRET: ${{ secrets.API_URL }}
        run: |
          if [ -n "$API_URL_SECRET" ]; then
            # Escape sed special characters in the URL (& / \)
            ESCAPED_URL=$(printf '%s\n' "$API_URL_SECRET" | sed 's/[&/\]/\\&/g')
            sed -i "s|__API_URL_PLACEHOLDER__|${ESCAPED_URL}|g" ./web/app.js
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          cname: num-osint.luckyverse.tech
          force_orphan: true
